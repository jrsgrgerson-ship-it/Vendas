<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Canil My Baby | Gerson 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        :root { --blue: #00f2ff; --green: #00ff88; --red: #ff0055; --bg: #050505; --card: #111; --border: #222; --yellow: #ffcc00; --white: #fff; }
        body { background: var(--bg); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 12px; padding-bottom: 60px; }
        #relogio { position: absolute; top: 18px; right: 15px; text-align: right; font-size: 11px; color: var(--green); font-weight: 800; line-height: 1.2; }
        header { padding: 12px 5px 20px 5px; border-bottom: 1px solid var(--border); margin-bottom: 20px; position: relative; }
        header h1 { margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase; }
        
        .sync-box { background: #1a1a1a; padding: 15px; border-radius: 18px; margin-bottom: 15px; border: 1px solid var(--green); text-align: center; }
        .sync-box span { font-size: 10px; color: var(--green); font-weight: 800; display: block; margin-bottom: 10px; }
        
        .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .fin-box { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); }
        .fin-box span { font-size: 8px; color: #888; font-weight: 800; display: block; text-transform: uppercase; margin-bottom: 4px; }
        .fin-box b { font-size: 17px; display: block; white-space: nowrap; }
        .full-box { grid-column: span 2; border-color: var(--green); background: linear-gradient(145deg, rgba(0,255,136,0.05) 0%, rgba(0,0,0,0) 100%); }
        .full-box b { color: var(--green); font-size: 24px; }

        .chart-wrapper { background: var(--card); border-radius: 28px; border: 1px solid var(--border); margin-bottom: 25px; padding: 15px; height: 320px; box-sizing: border-box; }

        .inputs { background: var(--card); padding: 22px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        input, select { background: #000; border: 1px solid #333; color: var(--white); padding: 15px; border-radius: 14px; width: 100%; box-sizing: border-box; font-size: 15px; }
        
        .btn-main { background: var(--white); color: #000; width: 100%; padding: 18px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .btn-sync { background: var(--green); color: #000; width: 48%; padding: 12px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        .btn-load { background: var(--blue); color: #000; width: 48%; padding: 12px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; font-size: 10px; }

        .item { background: var(--card); padding: 18px; border-radius: 22px; margin-bottom: 15px; border: 1px solid var(--border); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .btn-circle { width: 45px; height: 45px; border-radius: 12px; border: none; background: #252525; color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>
    <div id="relogio"></div>
    <header>
        <h1>My Baby | Gerson 🐾</h1>
        <select class="mes-selector" id="selecaoMes" onchange="render()" style="color:var(--green); border: 1px solid var(--green); background: #000; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; margin-top: 10px;">
            <option value="01/2026">Janeiro 2026</option>
            <option value="02/2026">Fevereiro 2026</option>
            <option value="03/2026">Março 2026</option>
            <option value="04/2026" selected>Abril 2026</option>
            <option value="05/2026">Maio 2026</option>
        </select>
    </header>

    <div class="sync-box">
        <span>☁️ SINCRONIZAÇÃO AUTOMÁTICA GITHUB</span>
        <div style="display: flex; justify-content: space-between;">
            <button class="btn-sync" onclick="salvarNoGithub()">💾 Salvar na Nuvem</button>
            <button class="btn-load" onclick="carregarDoGithub()">📥 Recuperar Dados</button>
        </div>
        <div id="syncStatus" style="font-size: 10px; margin-top: 10px; color: var(--yellow);">Status: Pronto para salvar</div>
    </div>

    <div class="fin-grid">
        <div class="fin-box full-box">
            <span id="labelSalario">💰 SALÁRIO LÍQUIDO</span>
            <b id="salLiq">R$ 0,00</b>
        </div>
        <div class="fin-box"><span>💵 BRUTO</span><b id="totBruto" style="color:var(--green)">R$ 0,00</b></div>
        <div class="fin-box"><span>📉 VALES</span><b id="totVales" style="color:var(--red)">R$ 0,00</b></div>
    </div>

    <div class="chart-wrapper"><canvas id="graficoVendas"></canvas></div>

    <div class="inputs">
        <div class="input-row">
            <input type="date" id="dataVenda">
            <select id="tipo"><option value="Spitz">🐕 Spitz</option><option value="Bengal">🐈 Bengal</option></select>
        </div>
        <input type="text" id="cliente" placeholder="👤 Nome do Cliente" style="margin-bottom:12px">
        <div class="input-row">
            <input type="number" id="valor" placeholder="💰 Valor">
            <input type="number" id="frete" placeholder="🚚 Frete">
        </div>
        <button class="btn-main" onclick="addVenda()">✅ REGISTRAR VENDA</button>
    </div>

    <div id="lista"></div>

<script>
    Chart.register(ChartDataLabels);
    
    // Configurações fixas para o Gerson
    const GH_TOKEN = "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";
    const GH_REPO = "jrsgrgerson/vendas-canil";
    const GH_URL = `https://api.github.com/repos/${GH_REPO}/contents/vendas.json`;

    let appData = JSON.parse(localStorage.getItem('canil_2026_db')) || { vendas: [] };
    let chart = null;

    document.getElementById('dataVenda').valueAsDate = new Date();

    async function salvarNoGithub() {
        document.getElementById('syncStatus').innerText = "Sincronizando com GitHub...";
        try {
            const resGet = await fetch(GH_URL, { headers: { Authorization: `token ${GH_TOKEN}` } });
            const dataGet = await resGet.json();
            const sha = dataGet.sha;
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(appData))));

            const resPut = await fetch(GH_URL, {
                method: 'PUT',
                headers: { Authorization: `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Backup Canil My Baby", content, sha })
            });

            if(resPut.ok) {
                document.getElementById('syncStatus').innerText = "✅ DADOS SEGUROS NO GITHUB!";
                document.getElementById('syncStatus').style.color = "var(--green)";
            }
        } catch (e) { 
            alert("Erro ao salvar! Verifique se o repositório 'vendas-canil' foi criado corretamente."); 
            document.getElementById('syncStatus').innerText = "❌ Erro na Sincronização";
        }
    }

    async function carregarDoGithub() {
        if(!confirm("Isso vai substituir os dados atuais pelos dados da nuvem. Continuar?")) return;
        try {
            const res = await fetch(GH_URL, { headers: { Authorization: `token ${GH_TOKEN}` } });
            const data = await res.json();
            appData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            localStorage.setItem('canil_2026_db', JSON.stringify(appData));
            render();
            alert("Dados recuperados com sucesso!");
        } catch (e) { alert("Erro ao carregar dados da nuvem."); }
    }

    function addVenda() {
        const c = document.getElementById('cliente').value, v = parseFloat(document.getElementById('valor').value);
        const dataEscolha = document.getElementById('dataVenda').value;
        if (!c || !v || !dataEscolha) return;

        const [ano, mes, dia] = dataEscolha.split('-');
        const mesRef = `${mes}/${ano}`;

        appData.vendas.push({
            id: Date.now(), mesRef: mesRef, cliente: c, valor: v,
            frete: parseFloat(document.getElementById('frete').value) || 0,
            tipo: document.getElementById('tipo').value,
            data: `${dia}/${mes}/${ano}`, ts: new Date(dataEscolha).getTime(), isVale: false
        });
        
        document.getElementById('cliente').value=''; document.getElementById('valor').value=''; document.getElementById('frete').value='';
        salvarLocal();
    }

    function salvarLocal() {
        localStorage.setItem('canil_2026_db', JSON.stringify(appData));
        render();
    }

    function render() {
        const mesAtivo = document.getElementById('selecaoMes').value;
        let bruto=0, vales=0;
        let histDiario = {};
        const vMes = appData.vendas.filter(v => v.mesRef === mesAtivo);

        vMes.forEach(v => {
            if (!v.isVale) {
                bruto += v.valor;
                let dia = parseInt(v.data.split('/')[0]);
                histDiario[dia] = (histDiario[dia] || 0) + v.valor;
            } else { vales += v.valor; }
        });

        const mesNum = parseInt(mesAtivo.split('/')[0]);
        let sal = mesNum >= 4 ? (bruto * 0.05) - vales : 2000 + (bruto * 0.03) - vales;
        
        document.getElementById('labelSalario').innerText = mesNum >= 4 ? "💰 COMISSÃO 5% (SEM FIXO)" : "💰 FIXO 2K + 3%";
        document.getElementById('salLiq').innerText = sal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totBruto').innerText = bruto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totVales').innerText = vales.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        const div = document.getElementById('lista'); div.innerHTML = '';
        vMes.sort((a,b) => b.ts - a.ts).forEach(v => {
            div.innerHTML += `
                <div class="item">
                    <div class="item-header">
                        <div><b>${v.cliente}</b><br><small>${v.data} • ${v.tipo}</small></div>
                        <div style="text-align:right">
                            <b>R$ ${v.valor.toLocaleString('pt-BR')}</b>
                            ${v.frete > 0 ? `<br><small style="color:var(--blue)">+ Frete ${v.frete}</small>` : ''}
                        </div>
                        <button class="btn-circle" onclick="del(${v.id})">🗑</button>
                    </div>
                </div>`;
        });
        desenharGrafico(histDiario);
    }

    function desenharGrafico(histDiario) {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        if (chart) chart.destroy();
        let labels = Array.from({length: 31}, (_, i) => i + 1);
        let dataAcum = [], acumulado = 0;
        labels.forEach(dia => {
            acumulado += (histDiario[dia] || 0);
            dataAcum.push(acumulado);
        });
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ data: dataAcum, borderColor: '#00ff88', borderWidth: 3, pointRadius: 0, fill: true, backgroundColor: 'rgba(0, 255, 136, 0.1)', tension: 0.3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { display: false } } }
        });
    }

    function del(id) { if(confirm("Apagar?")) { appData.vendas = appData.vendas.filter(x => x.id !== id); salvarLocal(); } }

    render();
    setInterval(() => { 
        const d = new Date(); 
        document.getElementById('relogio').innerHTML = d.toLocaleDateString('pt-BR') + '<br>' + d.toLocaleTimeString('pt-BR'); 
    }, 1000);
</script>
</body>
</html>
