<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Canil My Baby | Gerson 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root { --blue: #00f2ff; --green: #00ff88; --red: #ff0055; --bg: #050505; --card: #111; --border: #222; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 10px; }
        #relogio { position: absolute; top: 15px; right: 15px; text-align: right; font-size: 10px; color: var(--blue); font-weight: 800; line-height: 1.2; }
        header { padding: 10px 5px 15px 5px; border-bottom: 1px solid var(--border); margin-bottom: 15px; position: relative; }
        header h1 { margin: 0; font-size: 16px; font-weight: 800; text-transform: uppercase; text-shadow: 0 0 15px var(--blue); width: 70%; line-height: 1.1; }
        header p { margin: 5px 0 0 0; font-size: 11px; color: #888; font-weight: 600; }
        .mes-selector { background: #000; color: var(--blue); border: 1px solid var(--blue); padding: 8px; border-radius: 8px; font-size: 13px; margin-top: 12px; font-weight: 800; width: 100%; outline: none; }
        .meta-container { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; }
        .meta-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        .meta-target { font-size: 18px; color: var(--blue); font-weight: 800; cursor: pointer; text-decoration: underline; }
        .progress-bg { background: #000; height: 14px; border-radius: 20px; width: 100%; border: 1px solid #222; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0088ff, var(--blue)); box-shadow: 0 0 15px var(--blue); border-radius: 20px; transition: 1s; position: relative; }
        .rocket { position: absolute; right: -8px; top: -5px; font-size: 16px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-tag { background: #1a1a1a; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .stat-tag.delivery-box { border-color: var(--green); background: rgba(0, 255, 136, 0.05); }
        .stat-tag label { display: block; font-size: 9px; color: var(--blue); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
        .stat-tag.delivery-box label { color: var(--green); }
        .stat-tag value { font-size: 14px; font-weight: 800; color: #fff; display: block; }
        .stat-tag small { font-size: 10px; color: #888; font-weight: 600; display: block; line-height: 1.3; }
        .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .fin-box { background: var(--card); padding: 12px; border-radius: 14px; border: 1px solid var(--border); }
        .fin-box span { font-size: 8px; color: #666; font-weight: 700; display: block; margin-bottom: 3px; text-transform: uppercase; }
        .fin-box b { font-size: 16px; display: block; }
        .full-box { grid-column: span 2; border-color: #333; background: rgba(0,242,255,0.02); }
        .chart-wrapper { background: var(--card); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; height: 250px; padding: 15px; box-sizing: border-box; }
        .inputs { background: var(--card); padding: 18px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-size: 13px; font-family: inherit; }
        .btn-main { background: #fff; color: #000; width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; border: none; margin-bottom: 8px; cursor: pointer; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .btn-sec { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .item { background: var(--card); padding: 14px; border-radius: 15px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .btn-status { width: 38px; height: 38px; border-radius: 10px; border: none; background: #222; color: #fff; font-size: 16px; }
        .btn-status.on { background: var(--green); color: #000; }
        .btn-del { background: none; border: none; color: #444; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="relogio"></div>

    <header>
        <h1>Painel de Vendas<br>Canil My Baby 🐾</h1>
        <p>Especialista Spitz e Bengal: <b>Gerson</b></p>
        <select class="mes-selector" id="selecaoMes" onchange="mudarMes()">
            <option value="01/2026">Janeiro 2026</option>
            <option value="02/2026">Fevereiro 2026</option>
            <option value="03/2026">Março 2026</option>
            <option value="04/2026">Abril 2026</option>
        </select>
    </header>

    <div class="meta-container">
        <div class="meta-header">
            <div><span style="font-size:10px; color:#666; font-weight:800">🎯 META</span><div class="meta-target" id="txtMeta" onclick="editarMeta()">R$ 150.000,00</div></div>
            <div id="txtPerc" style="color:var(--green); font-weight: 800; font-size: 14px;">0%</div>
        </div>
        <div class="progress-bg"><div class="progress-fill" id="barraProg"><span class="rocket">🚀</span></div></div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag"><label>🐕 Total Spitz</label><value id="vTotSpitz">0</value><small id="vSubSpitz">0 M | 0 F</small></div>
        <div class="stat-tag"><label>🐈 Total Bengal</label><value id="vTotBengal">0</value><small id="vSubBengal">0 M | 0 F</small></div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag delivery-box"><label>🚚 Spitz Entregues</label><value id="eTotSpitz">0</value><small id="eSubSpitz">0 M | 0 F</small></div>
        <div class="stat-tag delivery-box"><label>🚚 Bengal Entregues</label><value id="eTotBengal">0</value><small id="eSubBengal">0 M | 0 F</small></div>
    </div>

    <div class="fin-grid">
        <div class="fin-box full-box"><span>💵 Faturamento Bruto</span><b id="totBruto" style="color:var(--blue)">R$ 0</b></div>
    </div>

    <div class="fin-grid">
        <div class="fin-box"><span>💰 Comis. (3%)</span><b id="totComissao" style="color:var(--yellow)">R$ 0</b></div>
        <div class="fin-box"><span>💸 Vales</span><b id="totDescontos" style="color:var(--red)">R$ 0</b></div>
    </div>
    <div class="fin-grid">
        <div class="fin-box full-box" style="border-color: var(--green);"><span>✅ Líquido Real</span><b id="salLiq" style="color:var(--green)">R$ 0</b></div>
    </div>

    <div class="chart-wrapper"><canvas id="graficoVendas"></canvas></div>

    <div class="inputs">
        <div style="display:flex; gap:6px;">
            <select id="tipo"><option value="Spitz">🐕 Spitz</option><option value="Bengal">🐈 Bengal</option></select>
            <select id="sexo"><option value="Macho">♂ Macho</option><option value="Fêmea">♀ Fêmea</option></select>
        </div>
        <input type="text" id="cliente" placeholder="👤 Nome do Cliente">
        <input type="number" id="valor" placeholder="💰 Valor da Venda (R$)">
        <button class="btn-main" onclick="addVenda()">✅ SALVAR VENDA</button>
        <div class="btn-group">
            <button class="btn-sec" onclick="addVale()">➖ Vale</button>
            <button class="btn-sec" onclick="gerarPDF()">📄 PDF</button>
            <button class="btn-sec" onclick="exportarDados()">💾 Backup</button>
        </div>
    </div>

    <div id="lista"></div>

<script>
    Chart.register(ChartDataLabels); // Ativa os números dentro do gráfico

    let appData = JSON.parse(localStorage.getItem('canil_2026_db')) || { mesAtivo: "02/2026", metas: {"02/2026":150000}, vendas: [] };
    let chart = null;

    function salvar() { localStorage.setItem('canil_2026_db', JSON.stringify(appData)); render(); }
    function mudarMes() { appData.mesAtivo = document.getElementById('selecaoMes').value; salvar(); }
    function editarMeta() {
        let m = appData.metas[appData.mesAtivo] || 150000;
        const n = prompt("Nova Meta:", m);
        if (n) { appData.metas[appData.mesAtivo] = parseFloat(n); salvar(); }
    }

    function editarData(id) {
        const v = appData.vendas.find(x => x.id === id);
        const novaData = prompt("Editar Data (ex: 01/02):", v.data.substring(0,5));
        if (novaData) { v.data = novaData + "/2026"; salvar(); }
    }

    function addVenda() {
        const c = document.getElementById('cliente').value, v = parseFloat(document.getElementById('valor').value);
        if (c && v) {
            appData.vendas.push({ id: Date.now(), mesRef: appData.mesAtivo, cliente: c, valor: v, tipo: document.getElementById('tipo').value, sexo: document.getElementById('sexo').value, data: new Date().toLocaleDateString('pt-BR'), entregue: false, isVale: false, ts: Date.now() });
            document.getElementById('cliente').value = ''; document.getElementById('valor').value = ''; salvar();
        }
    }

    function addVale() {
        const v = prompt("Valor do Vale:");
        if (v) { appData.vendas.push({ id: Date.now(), mesRef: appData.mesAtivo, cliente: 'VALE', valor: parseFloat(v), data: new Date().toLocaleDateString('pt-BR'), isVale: true, ts: Date.now() }); salvar(); }
    }

    function del(id) { if(confirm("Excluir?")) { appData.vendas = appData.vendas.filter(x => x.id !== id); salvar(); } }
    function toggleStatus(id) { const v = appData.vendas.find(x => x.id === id); v.entregue = !v.entregue; salvar(); }

    function render() {
        const metaM = appData.metas[appData.mesAtivo] || 150000;
        document.getElementById('txtMeta').innerText = "R$ " + metaM.toLocaleString();
        document.getElementById('selecaoMes').value = appData.mesAtivo;

        let bruto = 0, vales = 0;
        let vS_M = 0, vS_F = 0, vB_M = 0, vB_F = 0;
        let eS_M = 0, eS_F = 0, eB_M = 0, eB_F = 0;

        let histMap = new Map();
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo).sort((a,b)=>a.ts-b.ts);

        vMes.forEach(v => {
            if (!v.isVale) {
                bruto += v.valor;
                if(v.tipo === 'Spitz') { v.sexo === 'Macho' ? vS_M++ : vS_F++; }
                else { v.sexo === 'Macho' ? vB_M++ : vB_F++; }
                if(v.entregue) {
                    if(v.tipo === 'Spitz') { v.sexo === 'Macho' ? eS_M++ : eS_F++; }
                    else { v.sexo === 'Macho' ? eB_M++ : eB_F++; }
                }
                let dia = v.data.substring(0,5);
                histMap.set(dia, (histMap.get(dia) || 0) + v.valor);
            } else { vales += v.valor; }
        });

        document.getElementById('vTotSpitz').innerText = vS_M + vS_F;
        document.getElementById('vSubSpitz').innerText = `${vS_M}M | ${vS_F}F`;
        document.getElementById('vTotBengal').innerText = vB_M + vB_F;
        document.getElementById('vSubBengal').innerText = `${vB_M}M | ${vB_F}F`;
        document.getElementById('eTotSpitz').innerText = eS_M + eS_F;
        document.getElementById('eSubSpitz').innerText = `${eS_M}M | ${eS_F}F`;
        document.getElementById('eTotBengal').innerText = eB_M + eB_F;
        document.getElementById('eSubBengal').innerText = `${eB_M}M | ${eB_F}F`;
        
        document.getElementById('totBruto').innerText = "R$ " + bruto.toLocaleString();
        let com = bruto * 0.03;
        document.getElementById('totComissao').innerText = "R$ " + com.toLocaleString();
        document.getElementById('totDescontos').innerText = "R$ " + vales.toLocaleString();
        document.getElementById('salLiq').innerText = "R$ " + (2000 + com - vales).toLocaleString();
        
        const perc = (bruto / metaM) * 100;
        document.getElementById('barraProg').style.width = Math.min(perc, 100) + '%';
        document.getElementById('txtPerc').innerText = perc.toFixed(1) + '%';

        const div = document.getElementById('lista'); div.innerHTML = '';
        [...vMes].reverse().forEach(v => {
            div.innerHTML += `<div class="item"><div><b onclick="editarData(${v.id})" style="text-decoration:underline; cursor:pointer">${v.isVale ? '📉 VALE' : v.cliente}</b><small>${v.data.substring(0,5)} ${v.isVale ? '' : '• '+v.tipo+' '+v.sexo}</small></div><div class="actions"><div style="font-weight:800; color:${v.isVale ? 'var(--red)' : '#fff'}">${v.isVale ? '-' : ''} R$ ${v.valor.toLocaleString()}</div><button class="btn-status ${v.entregue ? 'on' : ''}" onclick="toggleStatus(${v.id})">${v.entregue ? '✔' : '🚚'}</button><button class="btn-del" onclick="del(${v.id})">🗑</button></div></div>`;
        });

        // --- CONFIGURAÇÃO DO GRÁFICO MELHORADO ---
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        if (chart) chart.destroy();
        
        let acc = 0;
        const labels = Array.from(histMap.keys());
        if(labels.length === 0) labels.push(new Date().toLocaleDateString('pt-BR').substring(0,5)); // Garante que mostre o dia atual mesmo sem venda

        const dataVendas = Array.from(histMap.values()).map(v=>{acc+=v; return ((acc/metaM)*100)});
        
        // Criar linha de projeção ideal (meta diária)
        const totalDias = 30;
        const dataProjecao = labels.map((_, index) => (100 / totalDias) * (index + 1));

        chart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: labels, 
                datasets: [
                    { 
                        label: 'Seu Progresso',
                        data: dataVendas, 
                        borderColor: '#00f2ff', 
                        borderWidth: 4, 
                        fill: true, 
                        backgroundColor: 'rgba(0, 242, 255, 0.15)', 
                        tension: 0.4,
                        pointRadius: 6,
                        pointBackgroundColor: '#00f2ff',
                        datalabels: { align: 'top', color: '#00f2ff', font: { weight: 'bold', size: 12 }, formatter: (v) => v.toFixed(1) + '%' }
                    },
                    {
                        label: 'Meta Ideal',
                        data: dataProjecao,
                        borderColor: 'rgba(255,255,255,0.2)',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0,
                        datalabels: { display: false }
                    }
                ] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } }, 
                scales: { 
                    y: { 
                        min:0, 
                        max: Math.max(100, Math.ceil(Math.max(...dataVendas)/10)*10 + 10), 
                        ticks: { color: '#666', callback: v => v + '%' },
                        grid: { color: '#222' }
                    }, 
                    x: { ticks: { color: '#fff' }, grid: { display: false } } 
                } 
            }
        });
    }

    function gerarPDF() {
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo);
        const bruto = vMes.filter(v=>!v.isVale).reduce((a,b)=>a+b.valor,0);
        const vales = vMes.filter(v=>v.isVale).reduce((a,b)=>a+b.valor,0);
        const com = bruto * 0.03;
        let win = window.open('', '', 'height=700,width=900');
        win.document.write(`<html><head><title>Relatório Gerson</title><style>body{font-family:sans-serif;padding:40px;color:#333}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #eee;padding:12px;text-align:left}th{background:#f8f9fa;font-size:11px;text-transform:uppercase}.vale{color:#ff0055;font-weight:bold}.resumo-topo{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:#f8f9fa;padding:20px;border-radius:10px;margin:20px 0}.total-final{font-size:18px;font-weight:bold;color:green;grid-column:span 2;border-top:1px solid #ccc;padding-top:10px}</style></head><body>`);
        win.document.write(`<h1>Relatório Canil My Baby - ${appData.mesAtivo}</h1><p>Vendedor: Gerson</p><div class="resumo-topo"><div><p>Faturamento Bruto: <b>R$ ${bruto.toLocaleString()}</b></p><p>Comissão (3%): <b>R$ ${com.toLocaleString()}</b></p></div><div><p>Salário Fixo: <b>R$ 2.000,00</b></p><p class="vale">Total Vales: <b>- R$ ${vales.toLocaleString()}</b></p></div><p class="total-final">💰 Líquido a Receber: R$ ${(2000 + com - vales).toLocaleString()}</p></div><table><thead><tr><th>Data</th><th>Cliente</th><th>Raça/Sexo</th><th>Status</th><th>Valor</th></tr></thead><tbody>`);
        vMes.forEach(v => { win.document.write(`<tr><td>${v.data.substring(0,5)}</td><td>${v.cliente}</td><td>${v.isVale ? 'VALE' : v.tipo + ' ' + v.sexo}</td><td>${v.isVale ? '-' : (v.entregue ? 'Entregue' : 'Pendente')}</td><td class="${v.isVale ? 'vale' : ''}">${v.isVale ? '-' : ''} R$ ${v.valor.toLocaleString()}</td></tr>`); });
        win.document.write('</tbody></table></body></html>');
        win.document.close(); setTimeout(() => { win.print(); }, 500);
    }

    function exportarDados() { const blob = new Blob([JSON.stringify(appData)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup_canil_2026.json'; a.click(); }
    render();
    setInterval(() => { const agora = new Date(); const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; document.getElementById('relogio').innerHTML = `${dias[agora.getDay()]}, ${agora.toLocaleDateString('pt-BR')}<br>${agora.toLocaleTimeString('pt-BR')}`; }, 1000);
</script>
</body>
</html>
