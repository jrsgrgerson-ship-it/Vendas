<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Canil My Baby | Gerson 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        :root { --blue: #00f2ff; --green: #00ff88; --red: #ff0055; --bg: #050505; --card: #111; --border: #222; --yellow: #ffcc00; --white: #fff; }
        body { background: var(--bg); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 12px; padding-bottom: 60px; }
        #relogio { position: absolute; top: 18px; right: 15px; text-align: right; font-size: 11px; color: var(--green); font-weight: 800; line-height: 1.2; }
        header { padding: 12px 5px 20px 5px; border-bottom: 1px solid var(--border); margin-bottom: 20px; position: relative; }
        header h1 { margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase; color: var(--white); }
        .header-controls { display: flex; gap: 10px; align-items: center; margin-top: 15px; }
        .mes-selector { flex: 1; background: #000; color: var(--green); border: 1px solid var(--green); padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; outline: none; appearance: none; }
        .btn-meta { background: #1a1a1a; color: var(--white); border: 1px solid #333; padding: 14px; border-radius: 12px; cursor: pointer; }
        
        .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .fin-box { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); }
        .fin-box span { font-size: 8px; color: #888; font-weight: 800; display: block; text-transform: uppercase; margin-bottom: 4px; }
        .fin-box b { font-size: 17px; display: block; white-space: nowrap; }
        .full-box { grid-column: span 2; border-color: var(--green); background: linear-gradient(145deg, rgba(0,255,136,0.05) 0%, rgba(0,0,0,0) 100%); }
        .full-box b { color: var(--green); font-size: 24px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-tag { background: #181818; padding: 14px; border-radius: 16px; border: 1px solid #282828; }
        .stat-tag label { display: block; font-size: 9px; color: var(--green); font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .stat-tag value { font-size: 20px; font-weight: 800; display: block; }
        
        .chart-wrapper { background: var(--card); border-radius: 28px; border: 1px solid var(--border); margin: 10px 0 25px 0; padding: 15px; height: 320px; width: 100%; box-sizing: border-box; }
        .inputs { background: var(--card); padding: 22px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        input, select { background: #000; border: 1px solid #333; color: var(--white); padding: 15px; border-radius: 14px; width: 100%; box-sizing: border-box; font-size: 15px; }
        .btn-main { background: var(--white); color: #000; width: 100%; padding: 18px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .btn-group-sec { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-sec { background: #1a1a1a; color: var(--white); border: 1px solid #333; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        
        .item { background: var(--card); padding: 18px; border-radius: 22px; margin-bottom: 15px; border: 1px solid var(--border); }
        .item.is-vale { border-color: rgba(255, 0, 85, 0.3); background: rgba(255, 0, 85, 0.02); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
        .btn-status { flex: 2.5; padding: 12px; border-radius: 12px; border: none; background: #222; color: #aaa; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .btn-status.on { background: var(--green); color: #000; }
        .btn-circle { width: 45px; height: 45px; border-radius: 12px; border: none; background: #252525; color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 18px; }

        @media print { 
            body { background: #fff !important; color: #000 !important; }
            .inputs, .chart-wrapper, .btn-meta, .btn-group-sec, .actions, .mes-selector, #relogio { display: none !important; } 
            .fin-box, .stat-tag, .item { border: 1px solid #ddd !important; background: #fff !important; color: #000 !important; }
        }
    </style>
</head>
<body>
    <div id="relogio"></div>
    <header>
        <h1>My Baby | Gerson 🐾</h1>
        <div class="header-controls">
            <select class="mes-selector" id="selecaoMes" onchange="mudarMes()">
                <option value="01/2026">Janeiro 2026</option>
                <option value="02/2026">Fevereiro 2026</option>
                <option value="03/2026">Março 2026</option>
                <option value="04/2026">Abril 2026</option>
                <option value="05/2026">Maio 2026</option>
            </select>
            <button class="btn-meta" onclick="ajustarMeta()">⚙️ Meta</button>
        </div>
    </header>

    <div class="fin-grid">
        <div class="fin-box full-box">
            <span id="labelSalario">💰 SALÁRIO LÍQUIDO</span>
            <b id="salLiq">R$ 0,00</b>
        </div>
        <div class="fin-box"><span>💵 BRUTO (VENDAS)</span><b id="totBruto" style="color:var(--green)">R$ 0,00</b></div>
        <div class="fin-box" style="border-color: var(--red)"><span>📉 VALES PEGOS</span><b id="totVales" style="color:var(--red)">R$ 0,00</b></div>
        <div class="fin-box"><span>🎯 META</span><b id="metaDisplay" style="color:var(--yellow)">R$ 0,00</b></div>
        <div class="fin-box"><span>🐕 QTD VENDIDA</span><b id="qtdVendas">0</b></div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag"><label>🐕 Spitz</label><value id="vTotS">0</value></div>
        <div class="stat-tag"><label>🐈 Bengal</label><value id="vTotB">0</value></div>
    </div>

    <div class="chart-wrapper"><canvas id="graficoVendas"></canvas></div>

    <div class="inputs">
        <div class="input-row">
            <select id="tipo"><option value="Spitz">🐕 Spitz</option><option value="Bengal">🐈 Bengal</option></select>
            <select id="sexo"><option value="Macho">♂ Macho</option><option value="Fêmea">♀ Fêmea</option></select>
        </div>
        <input type="text" id="cliente" placeholder="👤 Nome do Cliente" style="margin-bottom:12px">
        <div class="input-row">
            <input type="number" id="valor" placeholder="💰 Valor do Filhote">
            <input type="number" id="frete" placeholder="🚚 Frete">
        </div>
        <input type="text" id="previsao" placeholder="📅 Previsão de Entrega" style="margin-bottom:12px">
        <button class="btn-main" onclick="addVenda()">✅ REGISTRAR VENDA</button>
        <div class="btn-group-sec">
            <button class="btn-sec" onclick="addVale()" style="border-color:var(--red)">➖ VALE</button>
            <button class="btn-sec" onclick="window.print()" style="color:var(--green)">📄 PDF</button>
            <button class="btn-sec" onclick="exportarDados()">💾 BACKUP</button>
        </div>
    </div>
    <div id="lista"></div>

<script>
    Chart.register(ChartDataLabels);
    
    // Tenta carregar os dados. Se não houver nada, cria o objeto inicial.
    let appData = JSON.parse(localStorage.getItem('canil_2026_db'));
    
    if(!appData) {
        appData = { 
            mesAtivo: "04/2026", 
            metas: {"01/2026":150000, "02/2026":150000, "03/2026":150000, "04/2026":150000}, 
            vendas: [] 
        };
    }

    let chart = null;

    function salvar() { 
        localStorage.setItem('canil_2026_db', JSON.stringify(appData)); 
        render(); 
    }

    function mudarMes() { 
        appData.mesAtivo = document.getElementById('selecaoMes').value; 
        salvar(); 
    }

    function ajustarMeta() {
        const n = prompt("Meta para " + appData.mesAtivo, appData.metas[appData.mesAtivo]);
        if(n) { appData.metas[appData.mesAtivo] = parseFloat(n); salvar(); }
    }
    
    function addVenda() {
        const c = document.getElementById('cliente').value, v = parseFloat(document.getElementById('valor').value);
        if (!c || !v) return;
        appData.vendas.push({
            id: Date.now(), mesRef: appData.mesAtivo, cliente: c, valor: v,
            frete: parseFloat(document.getElementById('frete').value) || 0,
            previsao: document.getElementById('previsao').value,
            tipo: document.getElementById('tipo').value, sexo: document.getElementById('sexo').value,
            data: new Date().toLocaleDateString('pt-BR'), entregue: false, isVale: false, ts: Date.now()
        });
        document.getElementById('cliente').value=''; document.getElementById('valor').value=''; document.getElementById('frete').value='';
        salvar();
    }

    function addVale() {
        const v = prompt("Valor do vale?");
        if(v) {
            appData.vendas.push({
                id: Date.now(), mesRef: appData.mesAtivo, cliente: 'RETIRADA DE VALE', valor: parseFloat(v),
                data: new Date().toLocaleDateString('pt-BR'), isVale: true, ts: Date.now(), frete: 0
            });
            salvar();
        }
    }

    function render() {
        let bruto=0, vales=0, s=0, b=0;
        let histDiario = {};
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo);
        const meta = appData.metas[appData.mesAtivo] || 150000;

        vMes.forEach(v => {
            if (!v.isVale) {
                bruto += v.valor;
                v.tipo === 'Spitz' ? s++ : b++;
                let dia = parseInt(v.data.split('/')[0]) || 1;
                histDiario[dia] = (histDiario[dia] || 0) + v.valor;
            } else { vales += v.valor; }
        });

        const mesNum = parseInt(appData.mesAtivo.split('/')[0]);
        let salCalculado = 0;
        if (mesNum >= 4) {
            salCalculado = (bruto * 0.05) - vales;
            document.getElementById('labelSalario').innerText = "💰 SALÁRIO (COMISSÃO 5% SEM FIXO)";
        } else {
            salCalculado = 2000 + (bruto * 0.03) - vales;
            document.getElementById('labelSalario').innerText = "💰 SALÁRIO (FIXO 2K + 3%)";
        }

        document.getElementById('metaDisplay').innerText = meta.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totBruto').innerText = bruto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totVales').innerText = vales.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('salLiq').innerText = salCalculado.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('vTotS').innerText = s; document.getElementById('vTotB').innerText = b;
        document.getElementById('qtdVendas').innerText = (s + b) + " Filhotes";
        document.getElementById('selecaoMes').value = appData.mesAtivo;

        const div = document.getElementById('lista'); div.innerHTML = '';
        [...vMes].sort((a,b) => b.ts - a.ts).forEach(v => {
            div.innerHTML += `
                <div class="item ${v.isVale ? 'is-vale' : ''}">
                    <div class="item-header">
                        <div>
                            <b style="color:${v.isVale ? 'var(--red)' : '#fff'}">${v.cliente}</b><br>
                            <small>${v.data.substring(0,5)} • ${v.isVale ? 'Retirada' : v.tipo + ' ' + v.sexo}</small>
                            ${v.previsao ? '<br><small style="color:var(--yellow)">📅 Prev: '+v.previsao+'</small>' : ''}
                        </div>
                        <div style="text-align:right">
                            <b style="color:${v.isVale ? 'var(--red)' : '#fff'}">${v.isVale ? '-' : ''} R$ ${v.valor.toLocaleString('pt-BR')}</b>
                            ${v.frete > 0 ? `<br><small style="color:var(--blue)">+ Frete R$ ${v.frete.toLocaleString('pt-BR')}</small>` : ''}
                        </div>
                    </div>
                    <div class="actions">
                        ${!v.isVale ? `<button class="btn-status ${v.entregue?'on':''}" onclick="toggleS(${v.id})">${v.entregue ? 'ENTREGUE' : 'PENDENTE'}</button>` : '<div style="flex:2.5"></div>'}
                        <button class="btn-circle" onclick="del(${v.id})">🗑</button>
                    </div>
                </div>`;
        });
        desenharGrafico(histDiario, meta);
    }

    function desenharGrafico(histDiario, meta) {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        if (chart) chart.destroy();
        let labels = [], dataAcum = [], acumulado = 0;
        let hoje = new Date().getDate();
        let mesAtualSistema = new Date().getMonth() + 1;
        let mesAtivoApp = parseInt(appData.mesAtivo.split('/')[0]);
        let isMesPassado = mesAtivoApp < mesAtualSistema;

        for (let i = 1; i <= 31; i++) {
            labels.push(i);
            acumulado += (histDiario[i] || 0);
            if (isMesPassado || i <= hoje) dataAcum.push((acumulado / meta) * 100);
            else dataAcum.push(null);
        }

        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [{ data: dataAcum, borderColor: '#00ff88', borderWidth: 4, fill: true, backgroundColor: 'rgba(0, 255, 136, 0.1)', tension: 0.3, pointRadius: 0, spanGaps: true }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { min: 0, max: Math.max(115, Math.max(...dataAcum.filter(v => v !== null)) + 15), ticks: { color: '#555', callback: v => v + '%' } },
                    x: { ticks: { color: '#555' }, grid: { display: false } }
                },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        display: (c) => c.dataIndex === (isMesPassado ? 27 : hoje-1),
                        align: 'top', color: '#00ff88', font: { weight: '800' }, formatter: v => Math.round(v) + '%'
                    }
                }
            }
        });
    }

    function toggleS(id) { const v = appData.vendas.find(x => x.id === id); v.entregue = !v.entregue; salvar(); }
    function del(id) { if(confirm("Apagar?")) { appData.vendas = appData.vendas.filter(x => x.id !== id); salvar(); } }
    
    // Função para baixar o arquivo de segurança
    function exportarDados() { 
        const blob = new Blob([JSON.stringify(appData)], {type: 'application/json'}); 
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob); 
        const dataH = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
        a.download = `backup_canil_${dataH}.json`; 
        a.click(); 
    }

    render();
    setInterval(() => { const d = new Date(); document.getElementById('relogio').innerHTML = d.toLocaleDateString('pt-BR') + '<br>' + d.toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
