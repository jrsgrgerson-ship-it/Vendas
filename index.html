<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Canil My Baby | Gerson 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root { --blue: #00f2ff; --green: #00ff88; --red: #ff0055; --bg: #050505; --card: #111; --border: #222; --yellow: #ffcc00; }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 10px; padding-bottom: 40px; }
        
        #relogio { position: absolute; top: 15px; right: 15px; text-align: right; font-size: 10px; color: var(--blue); font-weight: 800; line-height: 1.2; }
        
        header { padding: 10px 5px 15px 5px; border-bottom: 1px solid var(--border); margin-bottom: 15px; position: relative; }
        header h1 { margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase; color: #fff; letter-spacing: -0.5px; }
        
        .mes-selector { background: #000; color: var(--blue); border: 1px solid var(--blue); padding: 12px; border-radius: 10px; font-size: 14px; margin-top: 12px; font-weight: 800; width: 100%; appearance: none; }

        /* CARDS FINANCEIROS */
        .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .fin-box { background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .fin-box span { font-size: 9px; color: #666; font-weight: 800; display: block; text-transform: uppercase; margin-bottom: 5px; }
        .fin-box b { font-size: 18px; display: block; letter-spacing: -0.5px; }
        .full-box { grid-column: span 2; border-color: var(--green); background: rgba(0, 255, 136, 0.03); }
        .full-box b { color: var(--green); font-size: 24px; }

        /* STATUS DE VENDAS E ENTREGAS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-tag { background: #161616; padding: 12px; border-radius: 14px; border: 1px solid #252525; }
        .stat-tag.delivery { border-color: var(--green); background: rgba(0, 255, 136, 0.05); }
        .stat-tag label { display: block; font-size: 9px; color: var(--blue); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .stat-tag value { font-size: 18px; font-weight: 800; display: block; }
        .stat-tag small { font-size: 10px; color: #666; font-weight: 600; }

        /* FORMULÁRIO */
        .inputs { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { background: #000; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: var(--blue); outline: none; }
        .btn-main { background: #fff; color: #000; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        
        .btn-group-sec { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-sec { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 10px; font-size: 10px; font-weight: 800; cursor: pointer; }

        /* HISTÓRICO */
        .item { background: var(--card); padding: 16px; border-radius: 18px; margin-bottom: 12px; border: 1px solid var(--border); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .item-info b { font-size: 15px; color: #fff; }
        .item-info small { color: #888; font-weight: 600; }
        .pgto-tag { font-size: 10px; background: var(--blue); color: #000; padding: 2px 6px; border-radius: 5px; font-weight: 800; margin-left: 6px; vertical-align: middle; }
        
        .actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #222; }
        .btn-status { flex: 2; padding: 10px; border-radius: 10px; border: none; background: #222; color: #fff; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .btn-status.on { background: var(--green); color: #000; }
        .btn-edit { flex: 0.5; background: #333; color: #fff; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .btn-del { flex: 0.5; background: rgba(255, 0, 85, 0.1); color: var(--red); border: none; border-radius: 10px; font-size: 16px; }

        /* GRÁFICO FINAL */
        .chart-wrapper { background: var(--card); border-radius: 24px; border: 1px solid var(--border); margin-top: 25px; padding: 20px; height: 350px; width: 100%; box-sizing: border-box; }
        
        @media print { 
            .inputs, .chart-wrapper, header, .actions, .btn-group-sec, .mes-selector, #relogio { display: none !important; } 
            body { background: white; color: black; }
            .item { border: 1px solid #ddd; margin-bottom: 5px; page-break-inside: avoid; color: black; }
            .item b, .item small { color: black; }
        }
    </style>
</head>
<body>

    <div id="relogio"></div>

    <header>
        <h1>Painel My Baby | Gerson 🐾</h1>
        <select class="mes-selector" id="selecaoMes" onchange="mudarMes()">
            <option value="01/2026">Janeiro 2026</option>
            <option value="02/2026">Fevereiro 2026</option>
            <option value="03/2026">Março 2026</option>
        </select>
    </header>

    <div class="fin-grid">
        <div class="fin-box full-box">
            <span>💰 Total Líquido a Receber (Fixo + 3%)</span>
            <b id="salLiq">R$ 0,00</b>
        </div>
        <div class="fin-box">
            <span>💵 Faturamento</span>
            <b id="totBruto" style="color:var(--blue)">R$ 0,00</b>
        </div>
        <div class="fin-box">
            <span>💸 Vales</span>
            <b id="totDescontos" style="color:var(--red)">R$ 0,00</b>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag"><label>🐕 Spitz</label><value id="vTotS">0</value><small id="vSubS">0M | 0F</small></div>
        <div class="stat-tag"><label>🐈 Bengal</label><value id="vTotB">0</value><small id="vSubB">0M | 0F</small></div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag delivery"><label>🚚 Entregues Spitz</label><value id="eTotS">0</value></div>
        <div class="stat-tag delivery"><label>🚚 Entregues Bengal</label><value id="eTotB">0</value></div>
    </div>

    <div class="inputs">
        <div class="input-row">
            <select id="tipo"><option value="Spitz">🐕 Spitz</option><option value="Bengal">🐈 Bengal</option></select>
            <select id="sexo"><option value="Macho">♂ Macho</option><option value="Fêmea">♀ Fêmea</option></select>
        </div>
        <input type="text" id="cliente" placeholder="👤 Nome do Cliente" style="margin-bottom:10px">
        <div class="input-row">
            <input type="number" id="valor" placeholder="💰 Valor do Filhote">
            <input type="number" id="frete" placeholder="🚚 Frete">
        </div>
        <div class="input-row">
            <input type="text" id="previsao" placeholder="📅 Previsão Entrega">
            <select id="pgto"><option value="PIX">💎 PIX</option><option value="Cartão">💳 Cartão</option></select>
        </div>
        <button class="btn-main" onclick="addVenda()">✅ Salvar Novo Filhote</button>
        <div class="btn-group-sec">
            <button class="btn-sec" onclick="addVale()">➖ VALE</button>
            <button class="btn-sec" onclick="gerarPDF()">📄 PDF</button>
            <button class="btn-sec" onclick="exportarDados()">💾 BACKUP</button>
        </div>
    </div>

    <div id="lista"></div>

    <div class="chart-wrapper">
        <canvas id="graficoVendas"></canvas>
    </div>

<script>
    Chart.register(ChartDataLabels);
    let appData = JSON.parse(localStorage.getItem('canil_2026_db')) || { mesAtivo: "02/2026", metas: {"02/2026":150000}, vendas: [] };
    let chart = null;

    function salvar() { localStorage.setItem('canil_2026_db', JSON.stringify(appData)); render(); }
    function mudarMes() { appData.mesAtivo = document.getElementById('selecaoMes').value; salvar(); }
    
    function addVenda() {
        const c = document.getElementById('cliente').value, v = parseFloat(document.getElementById('valor').value);
        if (c && v) {
            appData.vendas.push({
                id: Date.now(), mesRef: appData.mesAtivo, cliente: c, valor: v,
                frete: parseFloat(document.getElementById('frete').value) || 0,
                previsao: document.getElementById('previsao').value || '',
                pgto: document.getElementById('pgto').value,
                tipo: document.getElementById('tipo').value,
                sexo: document.getElementById('sexo').value,
                data: new Date().toLocaleDateString('pt-BR'),
                entregue: false, isVale: false, ts: Date.now()
            });
            limpar(); salvar();
        }
    }

    function limpar() { 
        document.getElementById('cliente').value=''; 
        document.getElementById('valor').value=''; 
        document.getElementById('frete').value=''; 
        document.getElementById('previsao').value=''; 
    }

    function render() {
        let bruto=0, vales=0, comiss=0, sM=0, sF=0, bM=0, bF=0, eS=0, eB=0;
        let histMap = {};
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo);

        vMes.forEach(v => {
            if (!v.isVale) {
                bruto += v.valor; comiss += (v.valor * 0.03);
                if(v.tipo==='Spitz'){ v.sexo==='Macho'?sM++:sF++; if(v.entregue) eS++; }
                else { v.sexo==='Macho'?bM++:bF++; if(v.entregue) eB++; }
                let dia = parseInt(v.data.split('/')[0]) || 1;
                histMap[dia] = (histMap[dia] || 0) + v.valor;
            } else { vales += v.valor; }
        });

        document.getElementById('vTotS').innerText = (sM+sF);
        document.getElementById('vSubS').innerText = `${sM}M | ${sF}F`;
        document.getElementById('vTotB').innerText = (bM+bF);
        document.getElementById('vSubB').innerText = `${bM}M | ${bF}F`;
        document.getElementById('eTotS').innerText = eS;
        document.getElementById('eTotB').innerText = eB;
        
        document.getElementById('totBruto').innerText = "R$ " + bruto.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        document.getElementById('totDescontos').innerText = "R$ " + vales.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        document.getElementById('salLiq').innerText = "R$ " + (2000 + comiss - vales).toLocaleString('pt-BR', {minimumFractionDigits: 2});
        
        const div = document.getElementById('lista'); div.innerHTML = '';
        [...vMes].sort((a,b) => b.ts - a.ts).forEach(v => {
            div.innerHTML += `
                <div class="item">
                    <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                        <div class="item-info">
                            <b>${v.isVale ? '📉 VALE' : v.cliente} <span class="pgto-tag">${v.pgto||''}</span></b><br>
                            <small>${v.data.substring(0,5)} • ${v.tipo||''} ${v.sexo||''}</small><br>
                            ${v.previsao ? '<small style="color:var(--yellow)">🚚 Entrega: '+v.previsao+'</small>' : ''}
                        </div>
                        <div style="text-align:right">
                            <b style="color:var(--blue)">R$ ${(v.valor + (v.frete||0)).toLocaleString('pt-BR')}</b>
                            ${v.frete > 0 ? '<br><small style="color:#666">Frete: R$ '+v.frete+'</small>' : ''}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-status ${v.entregue?'on':''}" onclick="toggleS(${v.id})">${v.entregue?'ENTREGUE ✔':'PENDENTE 🚚'}</button>
                        <button class="btn-edit" onclick="editarVenda(${v.id})">✏️</button>
                        <button class="btn-del" onclick="del(${v.id})">🗑</button>
                    </div>
                </div>`;
        });
        desenharGrafico(histMap);
    }

    function desenharGrafico(histMap) {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        if (chart) chart.destroy();
        let labels = [], dataProg = [], dataMeta = [], acumulado = 0;
        let meta = appData.metas[appData.mesAtivo] || 150000;
        let hoje = new Date().getDate();
        for (let i = 1; i <= 31; i++) {
            labels.push(i);
            acumulado += (histMap[i] || 0);
            if (i <= hoje || histMap[i]) dataProg.push((acumulado / meta) * 100);
            else dataProg.push(null);
            dataMeta.push((100/31)*i);
        }
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [
                { 
                    data: dataProg, 
                    borderColor: '#00f2ff', 
                    borderWidth: 4, 
                    fill: true, 
                    backgroundColor: 'rgba(0, 242, 255, 0.1)', 
                    tension: 0.3, 
                    pointRadius: 2,
                    datalabels: { display: (c) => c.dataIndex === hoje-1, align: 'top', color: '#00f2ff', font:{weight:'800'}, formatter: (v)=>Math.round(v)+'%' }
                },
                { data: dataMeta, borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1, borderDash: [5,5], pointRadius: 0, datalabels: {display:false} }
            ]},
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                scales: { 
                    y: { min: 0, max: 110, display: false }, 
                    x: { ticks: { color: '#666', font:{size:10} }, grid: { display: false } } 
                }, 
                plugins: { legend: { display: false } } 
            }
        });
    }

    function toggleS(id) { const v = appData.vendas.find(x => x.id === id); v.entregue = !v.entregue; salvar(); }
    function del(id) { if(confirm("Deseja excluir este registro?")) { appData.vendas = appData.vendas.filter(x => x.id !== id); salvar(); } }
    
    function addVale() { 
        const v = prompt("Valor do Vale:"); 
        if(v) { 
            appData.vendas.push({ id: Date.now(), mesRef: appData.mesAtivo, cliente: 'VALE', valor: parseFloat(v), data: new Date().toLocaleDateString('pt-BR'), isVale: true, ts: Date.now() }); 
            salvar(); 
        } 
    }

    function editarVenda(id) {
        const v = appData.vendas.find(x => x.id === id);
        if(v && !v.isVale) {
            v.cliente = prompt("Nome do Cliente:", v.cliente) || v.cliente;
            v.valor = parseFloat(prompt("Valor do Filhote:", v.valor)) || v.valor;
            v.frete = parseFloat(prompt("Valor do Frete:", v.frete)) || 0;
            v.previsao = prompt("Previsão de Entrega:", v.previsao) || v.previsao;
            v.pgto = prompt("Forma de Pagamento (PIX/Cartão):", v.pgto) || v.pgto;
            salvar();
        }
    }

    function gerarPDF() {
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo && !v.isVale);
        let t = `<h2>Relatório Vendas My Baby - ${appData.mesAtivo}</h2><table border="1" style="width:100%; border-collapse:collapse; font-family:sans-serif; font-size:12px">
            <thead><tr style="background:#eee"><th>Data</th><th>Cliente</th><th>Raça</th><th>Pgto</th><th>Entrega</th><th>Valor</th><th>Frete</th></tr></thead><tbody>`;
        vMes.forEach(v => { t += `<tr><td>${v.data}</td><td>${v.cliente}</td><td>${v.tipo} ${v.sexo}</td><td>${v.pgto}</td><td>${v.previsao}</td><td>R$ ${v.valor.toLocaleString('pt-BR')}</td><td>R$ ${v.frete.toLocaleString('pt-BR')}</td></tr>`; });
        const win = window.open('', '', 'height=700,width=900');
        win.document.write(`<html><body style="font-family:sans-serif;padding:20px">${t}</tbody></table></body></html>`);
        win.document.close(); win.print();
    }

    function exportarDados() { 
        const blob = new Blob([JSON.stringify(appData)], {type: 'application/json'}); 
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
        a.download = 'canil_backup_'+appData.mesAtivo.replace('/','_')+'.json'; 
        a.click(); 
    }

    render();
    setInterval(() => {
        const d = new Date();
        document.getElementById('relogio').innerHTML = d.toLocaleDateString('pt-BR') + '<br>' + d.toLocaleTimeString('pt-BR');
    }, 1000);
</script>
</body>
</html>
