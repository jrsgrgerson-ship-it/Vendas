<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Canil My Baby | Gerson 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root { --blue: #00f2ff; --green: #00ff88; --red: #ff0055; --bg: #050505; --card: #111; --border: #222; }
        body { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 10px; padding-bottom: 50px; }
        #relogio { position: absolute; top: 15px; right: 15px; text-align: right; font-size: 10px; color: var(--blue); font-weight: 800; }
        header { padding: 5px 5px 10px 5px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        header h1 { margin: 0; font-size: 15px; font-weight: 800; text-transform: uppercase; color: #fff; }
        .mes-selector { background: #000; color: var(--blue); border: 1px solid var(--blue); padding: 8px; border-radius: 8px; font-size: 13px; margin-top: 8px; font-weight: 800; width: 100%; }
        
        /* FINANCEIRO */
        .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .fin-box { background: var(--card); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
        .fin-box span { font-size: 8px; color: #666; font-weight: 800; display: block; text-transform: uppercase; }
        .fin-box b { font-size: 14px; display: block; }
        .full-box { grid-column: span 2; border-color: var(--green); }
        .full-box b { color: var(--green); font-size: 16px; }

        /* CONTADORES */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .stat-tag { background: #161616; padding: 10px; border-radius: 10px; border: 1px solid #222; }
        .stat-tag.delivery { border-color: var(--green); background: rgba(0, 255, 136, 0.05); }
        .stat-tag label { display: block; font-size: 8px; color: var(--blue); font-weight: 800; text-transform: uppercase; }
        .stat-tag value { font-size: 14px; font-weight: 800; display: block; }
        .stat-tag small { font-size: 9px; color: #666; }

        /* INPUTS */
        .inputs { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        input, select { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 12px; }
        .btn-main { background: #fff; color: #000; width: 100%; padding: 12px; border-radius: 8px; font-weight: 800; border: none; cursor: pointer; }
        
        /* LISTA */
        .item { background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
        .actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; }
        .btn-status { flex: 2; padding: 8px; border-radius: 6px; border: none; background: #222; color: #fff; font-weight: 800; font-size: 10px; }
        .btn-status.on { background: var(--green); color: #000; }
        .btn-icon { flex: 1; padding: 8px; border-radius: 6px; border: none; background: #333; color: #fff; }

        /* GRÁFICO */
        .chart-container { background: var(--card); border-radius: 15px; border: 1px solid var(--border); margin-top: 20px; padding: 10px; height: 260px; width: 100%; box-sizing: border-box; }
        
        @media print { .inputs, .chart-container, .actions, button, .mes-selector, #relogio { display: none !important; } }
    </style>
</head>
<body>

    <div id="relogio"></div>

    <header>
        <h1>My Baby | Gerson 🐾</h1>
        <select class="mes-selector" id="selecaoMes" onchange="mudarMes()">
            <option value="01/2026">Janeiro 2026</option>
            <option value="02/2026">Fevereiro 2026</option>
            <option value="03/2026">Março 2026</option>
        </select>
    </header>

    <div class="fin-grid">
        <div class="fin-box full-box"><span>💰 A Receber (Fixo + 3% - Vales)</span><b id="salLiq">R$ 0</b></div>
        <div class="fin-box"><span>💵 Bruto Vendas</span><b id="totBruto" style="color:var(--blue)">R$ 0</b></div>
        <div class="fin-box"><span>💸 Vales</span><b id="totDescontos" style="color:var(--red)">R$ 0</b></div>
    </div>

    <div class="stats-grid">
        <div class="stat-tag"><label>🐕 Spitz</label><value id="vTotS">0</value><small id="vSubS">0M|0F</small></div>
        <div class="stat-tag"><label>🐈 Bengal</label><value id="vTotB">0</value><small id="vSubB">0M|0F</small></div>
        <div class="stat-tag delivery"><label>🚚 Entregues S.</label><value id="eTotS">0</value></div>
        <div class="stat-tag delivery"><label>🚚 Entregues B.</label><value id="eTotB">0</value></div>
    </div>

    <div class="inputs">
        <div class="input-row">
            <select id="tipo"><option value="Spitz">🐕 Spitz</option><option value="Bengal">🐈 Bengal</option></select>
            <select id="sexo"><option value="Macho">♂ Macho</option><option value="Fêmea">♀ Fêmea</option></select>
        </div>
        <input type="text" id="cliente" placeholder="👤 Cliente" style="margin-bottom:6px">
        <div class="input-row">
            <input type="number" id="valor" placeholder="💰 Valor">
            <input type="number" id="frete" placeholder="🚚 Frete">
        </div>
        <input type="text" id="previsao" placeholder="📅 Entrega" style="margin-bottom:8px">
        <button class="btn-main" onclick="addVenda()">✅ SALVAR</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:8px;">
            <button onclick="addVale()" style="background:#222;color:#fff;border:1px solid #333;padding:8px;border-radius:6px;font-size:9px;">VALE</button>
            <button onclick="window.print()" style="background:#222;color:#fff;border:1px solid #333;padding:8px;border-radius:6px;font-size:9px;">PDF</button>
            <button onclick="exportarDados()" style="background:#222;color:#fff;border:1px solid #333;padding:8px;border-radius:6px;font-size:9px;">BACKUP</button>
        </div>
    </div>

    <div id="lista"></div>

    <div class="chart-container">
        <canvas id="graficoVendas"></canvas>
    </div>

<script>
    Chart.register(ChartDataLabels);
    let appData = JSON.parse(localStorage.getItem('canil_2026_db')) || { mesAtivo: "02/2026", metas: {"02/2026":150000}, vendas: [] };
    let chart = null;

    function salvar() { localStorage.setItem('canil_2026_db', JSON.stringify(appData)); render(); }
    function mudarMes() { appData.mesAtivo = document.getElementById('selecaoMes').value; salvar(); }

    function addVenda() {
        const c = document.getElementById('cliente').value, v = parseFloat(document.getElementById('valor').value);
        if (c && v) {
            appData.vendas.push({
                id: Date.now(), mesRef: appData.mesAtivo, cliente: c, valor: v,
                frete: parseFloat(document.getElementById('frete').value) || 0,
                previsao: document.getElementById('previsao').value || '',
                tipo: document.getElementById('tipo').value,
                sexo: document.getElementById('sexo').value,
                data: new Date().toLocaleDateString('pt-BR'),
                entregue: false, isVale: false, ts: Date.now()
            });
            document.getElementById('cliente').value=''; document.getElementById('valor').value='';
            salvar();
        }
    }

    function render() {
        let bruto=0, vales=0, comiss=0, sM=0, sF=0, bM=0, bF=0, eS=0, eB=0;
        let histMap = {};
        const vMes = appData.vendas.filter(v => v.mesRef === appData.mesAtivo);

        vMes.forEach(v => {
            if (!v.isVale) {
                bruto += v.valor; comiss += (v.valor * 0.03);
                if(v.tipo==='Spitz'){ v.sexo==='Macho'?sM++:sF++; if(v.entregue) eS++; }
                else { v.sexo==='Macho'?bM++:bF++; if(v.entregue) eB++; }
                let dia = parseInt(v.data.split('/')[0]) || 1;
                histMap[dia] = (histMap[dia] || 0) + v.valor;
            } else { vales += v.valor; }
        });

        document.getElementById('vTotS').innerText = (sM+sF);
        document.getElementById('vSubS').innerText = `${sM}M|${sF}F`;
        document.getElementById('vTotB').innerText = (bM+bF);
        document.getElementById('vSubB').innerText = `${bM}M|${bF}F`;
        document.getElementById('eTotS').innerText = eS;
        document.getElementById('eTotB').innerText = eB;
        document.getElementById('totBruto').innerText = "R$ " + bruto.toLocaleString();
        document.getElementById('totDescontos').innerText = "R$ " + vales.toLocaleString();
        document.getElementById('salLiq').innerText = "R$ " + (2000 + comiss - vales).toLocaleString();
        
        const div = document.getElementById('lista'); div.innerHTML = '';
        [...vMes].sort((a,b) => b.ts - a.ts).forEach(v => {
            div.innerHTML += `<div class="item">
                <div style="display:flex; justify-content:space-between">
                    <div><b>${v.isVale?'📉 VALE':v.cliente}</b><br><small style="color:#888">${v.data.substring(0,5)} • ${v.tipo||''}</small></div>
                    <div style="text-align:right"><b>R$ ${(v.valor+(v.frete||0)).toLocaleString()}</b></div>
                </div>
                <div class="actions">
                    <button class="btn-status ${v.entregue?'on':''}" onclick="toggleS(${v.id})">${v.entregue?'ENTREGUE':'PENDENTE'}</button>
                    <button class="btn-icon" onclick="editarVenda(${v.id})">✏️</button>
                    <button class="btn-icon" onclick="del(${v.id})">🗑</button>
                </div>
            </div>`;
        });
        desenharGrafico(histMap);
    }

    function desenharGrafico(histMap) {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        if (chart) chart.destroy();
        let labels = [], dataProg = [], acumulado = 0;
        let meta = appData.metas[appData.mesAtivo] || 150000;
        let hoje = new Date().getDate();
        for (let i = 1; i <= 31; i++) {
            labels.push(i);
            acumulado += (histMap[i] || 0);
            if (i <= hoje || histMap[i]) dataProg.push((acumulado / meta) * 100);
            else dataProg.push(null);
        }
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [{ data: dataProg, borderColor: '#00f2ff', borderWidth: 3, fill: true, backgroundColor: 'rgba(0, 242, 255, 0.1)', tension: 0.3, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 110, display: false }, x: { ticks: { color: '#444', font:{size:8} }, grid: { display: false } } }, plugins: { legend: { display: false }, datalabels: { display: (c) => c.dataIndex === hoje-1, color: '#00f2ff', font:{weight:'bold'}, formatter: (v)=>Math.round(v)+'%' } } }
        });
    }

    function toggleS(id) { const v = appData.vendas.find(x => x.id === id); v.entregue = !v.entregue; salvar(); }
    function del(id) { if(confirm("Excluir?")) { appData.vendas = appData.vendas.filter(x => x.id !== id); salvar(); } }
    function addVale() { const v = prompt("Valor do Vale:"); if(v) { appData.vendas.push({ id: Date.now(), mesRef: appData.mesAtivo, cliente: 'VALE', valor: parseFloat(v), data: new Date().toLocaleDateString('pt-BR'), isVale: true, ts: Date.now() }); salvar(); } }
    function exportarDados() { const blob = new Blob([JSON.stringify(appData)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click(); }
    function editarVenda(id) {
        const v = appData.vendas.find(x => x.id === id);
        if(v && !v.isVale) {
            v.cliente = prompt("Cliente:", v.cliente) || v.cliente;
            v.valor = parseFloat(prompt("Valor:", v.valor)) || v.valor;
            v.frete = parseFloat(prompt("Frete:", v.frete)) || 0;
            salvar();
        }
    }

    render();
    setInterval(() => { document.getElementById('relogio').innerHTML = new Date().toLocaleDateString('pt-BR') + '<br>' + new Date().toLocaleTimeString('pt-BR'); }, 1000);
</script>
</body>
</html>
